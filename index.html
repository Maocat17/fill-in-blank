['c','範例 1：一般單字題（沒有搭配詞與筆記）',['英文句子：Every person’s fingerprints are [unique]. No two people’s are alike.','單字解釋：(adj.) 與眾不同的','句子翻譯：每個人的指紋都是[獨一無二的]。沒有人是相同的。','搭配詞/片語：（無）','搭配詞/片語 翻譯：（無）','筆記：（無）'].join('\n')],
['c','範例 2：含搭配詞與筆記',['英文句子：Kiwi birds are [unique] to New Zealand. Nowhere else you can find them.','單字解釋：(adj.) 獨有的','句子翻譯：奇異鳥[為]紐西蘭[所獨有]，其他地方都找不到。','搭配詞/片語：be unique to + 地方','搭配詞/片語 翻譯：為某地方所獨有','筆記：=be native to + 地方'].join('\n')],
['h','設定提示的字首與字尾'],

['h','貼上文字自動生成'],

['c','自動生成輸入範例（每行一題）',['Kiwi birds are [unique] to New Zealand. Nowhere else you can find them.（奇異鳥[為]紐西蘭[所獨有]，其他地方都找不到。）｜unique (adj.) 獨有的｜be unique to + 地方（為某地方所獨有）','She realized that she had left her wallet at home.（她發覺自己把錢包忘在家裡了。）｜realize (v.) 了解'].join('\n')],

['l',[[hd('字','尾'),'字首＋字尾（完整提示）：字首給一個字母，字尾通常也給一個字母；如果單字有 es、ies、ed、ied 的變化結尾，會完整顯示變化結尾，有時再多顯示一個字母。'],

const sySave=()=>{try{localStorage.setItem(SYK,JSON.stringify({url:SY.url,token:SY.token,last:SY.last,h:SY.h,pend:SY.pend}))}catch(e){}};
const payload=()=>({app:'fillblank',v:3,ts:S.ts||0,decks:S.decks,folders:S.folders,prog:S.prog,reps:S.reps,reports:S.reports,cs:S.cs,total:S.total,cfg:S.cfg,sess:S.sess});

function syHTML(){const d=SY.last?new Date(SY.last):null,hm=d?`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'';
 const L=`<a href="${DOCURL}" target=_blank rel=noopener>Google 文件</a>`;
 const T={off:`尚未設定同步到 ${L}`,syncing:'同步中…',ok:`已同步到 ${L}${hm?`（${hm}）`:''}`,pending:'有變更，等待同步…',offline:'離線中，連線後會自動同步',err:`同步失敗：${esc(SY.msg)}`}[SY.st];
 return `<div class="sy ${SY.st=='ok'?'ok':SY.st=='err'?'err':''}"><div class=syt><i></i><span>${T}</span></div><div class=syb><button class=sec data-act=syncnow>上傳資料</button><button class=sec data-act=dlall>下載資料</button><button class=sec data-act=syncset>設定</button></div></div>`}
const SDC={off:'',syncing:'ing',pending:'ing',offline:'ing',ok:'ok',err:'err'},SDT={off:'未設定同步',syncing:'同步中',pending:'有變更，等待同步',offline:'離線，連線後同步',ok:'已同步',err:'同步失敗'};

const syChk=j=>{if(!j||!j.ok)throw new Error(j&&j.error=='token'?'密碼（Token）不符':(j&&j.error)||'伺服器錯誤');return j};
async function syFetch(body){let to;const tm=new Promise((_,rej)=>{to=setTimeout(()=>{const e=new Error('連線逾時');e.name='TimeoutError';rej(e)},25000)});
 try{const req=body?fetch(SY.url,{method:'POST',body:JSON.stringify({...body,token:SY.token}),redirect:'follow'}):fetch(SY.url+(SY.url.includes('?')?'&':'?')+'token='+encodeURIComponent(SY.token)+'&t='+Date.now(),{redirect:'follow'});
  const r=await Promise.race([req,tm]);let j;try{j=await Promise.race([r.json(),tm])}catch(e){if(e&&e.name=='TimeoutError')throw e;throw new Error('回應格式不正確，請確認網址是 Apps Script 的部署網址（/exec）')}
  return syChk(j)}finally{clearTimeout(to)}}
function syJsonp(p){return new Promise((res,rej)=>{const cb='sycb'+Date.now()+Math.floor(Math.random()*1e4),sc=document.createElement('script');let done=0,t;const fin=(e,v)=>{if(done)return;done=1;clearTimeout(t);try{delete window[cb]}catch(x){window[cb]=undefined}sc.remove();e?rej(e):res(v)};window[cb]=v=>fin(0,v);t=setTimeout(()=>fin(new Error('逾時')),15000);sc.onerror=()=>fin(new Error('載入失敗'));sc.src=SY.url+'?'+new URLSearchParams({...p,token:SY.token,callback:cb}).toString();document.head.append(sc)})}
function syForm(fields){return new Promise((res,rej)=>{const id='syf'+Date.now()+Math.floor(Math.random()*1e4),ifr=document.createElement('iframe'),f=document.createElement('form');let done=0,t;ifr.name=id;ifr.style.display='none';f.method='POST';f.action=SY.url;f.target=id;f.style.display='none';
 const on=e=>{if(e.data&&e.data.sy===id)fin(0,e.data)},fin=(er,v)=>{if(done)return;done=1;clearTimeout(t);window.removeEventListener('message',on);ifr.remove();f.remove();er?rej(er):res(v)};
 t=setTimeout(()=>fin(new Error('逾時')),30000);window.addEventListener('message',on);
 Object.entries({...fields,token:SY.token,reqid:id}).forEach(([k,v])=>{const i=document.createElement('textarea');i.name=k;i.value=v;f.append(i)});document.body.append(ifr,f);f.submit()})}
async function syCall(body){

  catch(e2){if(e2&&/Token/.test(e2.message||''))throw e2;const er=new Error('無法連線到 Apps Script。請確認：部署存取權為「任何人」、已完成授權，且已更新成「設定」裡最新版的程式碼並重新部署；若是在 Claude 預覽視窗中開啟，請改用瀏覽器開啟下載的檔案');er.name='NetError';throw er}}}

const doPush=async()=>{const h0=hsh(snapStr());await syCall({action:'set',text:JSON.stringify(payload())});SY.h=h0;SY.last=Date.now();SY.pend=hsh(snapStr())!==h0;sySave()};
const markSynced=()=>{SY.h=hsh(snapStr());SY.pend=false;SY.last=Date.now();sySave()};
const parseDoc=t=>{t=(t||'').trim();if(!t)return null;try{const j=JSON.parse(t);return j&&(j.app=='fillblank'||j.app===undefined)&&Array.isArray(j.decks)?j:null}catch(e){return null}};
const idle=()=>view=='home'||view=='profile';

/* 只有「資料有變更」才會上傳：與上次同步的內容比對，沒變就不送 */
function syQueue(){if(!SY.url)return;if(hsh(snapStr())===SY.h){if(SY.pend){SY.pend=false;sySave()}if(SY.st=='pending')syUpd('ok');return}
 SY.pend=true;sySave();if(!navigator.onLine)return syUpd('offline');if(!SY.ready)return;syUpd('pending');clearTimeout(SY.tm);SY.tm=setTimeout(syPush,3000)}

function syAsk1(pend){return new Promise(res=>{const m=modal(`<h3>雲端資料與本機不同</h3><p>${pend?'這台裝置有尚未上傳的變更，而雲端的資料也已被更新過。':'這台裝置尚未同步過，而雲端已有學習記錄。'}要下載雲端資料取代本機，還是用本機資料覆蓋雲端？</p><div class=rt><button class=sec id=a>下載雲端資料</button><button class=pri id=b>上傳本機資料</button></div>`),c0=m.close;m.close=()=>{c0();res('cancel')};m.querySelector('#a').onclick=()=>{res('cloud');c0()};m.querySelector('#b').onclick=()=>{res('local');c0()}})}

/* 開啟／恢復連線／首次設定：以「下載」為主。沒有本機變更 → 直接用雲端資料；有本機變更且雲端沒被動過 → 上傳；兩邊都動過 → 詢問 */
async function sync(manual){
 if(!SY.url){syUpd('off');if(manual)syncSet();return}
 if(!navigator.onLine){syUpd('offline');if(manual)toast('目前離線，連線後會自動同步');return}

   if(rh===hsh(snapStr()))markSynced();

   else{setData(rem);msg='已從雲端載入最新資料'}}
  SY.ready=true;SY.busy=false;syUpd('ok');if(manual)toast(msg);if(SY.pend)syQueue()}
 catch(e){const m=syErr(e);if(manual)toast('同步失敗：'+m)}}

 try{if(!S.ts){S.ts=Date.now();saveRaw()}await doPush();SY.ready=true;SY.busy=false;syUpd('ok');toast('已清空文件並寫入最新資料');if(SY.pend)syQueue()}

function syncSet(){const tk=(SY.token||DEF_TOKEN).replace(/['\\\n]/g,''),code=`const DOC_ID = '${DOCID}';
const TOKEN = '${tk}';

function json_(o, cb) {
  var t = JSON.stringify(o);
  if (cb && /^[\\w$.]+$/.test(cb)) {
    return ContentService.createTextOutput(cb + '(' + t + ')')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }

    .setMimeType(ContentService.MimeType.JSON);

function doGet(e) {
  var p = e.parameter;
  if (p.token !== TOKEN) return json_({ok: false, error: 'token'}, p.callback);

  return json_({ok: true, text: text}, p.callback);
}
function save_(text) {
  var body = DocumentApp.openById(DOC_ID).getBody();
  body.clear();
  body.setText(text);
}
function doPost(e) {
  var p = e.parameter;
  if (p.reqid) {
    var id = String(p.reqid).replace(/[^\\w]/g, '');
    var ok = p.token === TOKEN;
    if (ok) save_(p.text);
    var msg = JSON.stringify({sy: id, ok: ok, error: ok ? '' : 'token'}).replace(/</g, '\\\\u003c');
    return HtmlService.createHtmlOutput(
      '<script>var m=' + msg + ';[window.parent.parent, window.top].forEach(function(w){try{w.postMessage(m,"*")}catch(x){}})<\/script>'

  }

  save_(d.text);
  return json_({ok: true});

 const m=modal(`<h3>Google 文件同步設定</h3><p style="font-size:13px;line-height:1.7;margin:0 0 8px">網頁無法直接改寫 Google 文件，需先用你的 Google 帳號建立一個免費的 Apps Script 當橋接：<br>1. 開啟 script.google.com → 新增專案，貼上下方程式碼，並把 TOKEN 改成自訂密碼。<br>2. 按「部署 → 新增部署」，類型選「網頁應用程式」，執行身分選「我」，存取權選「任何人」，完成授權後複製網址。（之後若更新程式碼：部署 → 管理部署 → 編輯 → 版本選「新版本」→ 部署，網址不變。）<br>3. 把網址與同一組密碼填到下方。</p><textarea id=sc readonly rows=9 style="font-size:12px;font-family:ui-monospace,Menlo,monospace">${esc(code)}</textarea><div class=row style="margin:6px 0 0"><button class=sec id=cc>複製程式碼</button></div>
