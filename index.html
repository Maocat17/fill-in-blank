 <div class=row style="margin-top:8px"><button class=sec id=e1>匯出選取題庫</button><button class=sec id=e2>匯出學習記錄</button></div><div id=exo></div></div>
 <div class=card style="padding:16px 18px;margin-top:14px"><label style="margin-top:0">匯入（TXT 題庫，或學習記錄 JSON）</label><div class=row style="margin-bottom:8px"><label class="sec fbtn" for=fl>選擇檔案</label><span id=fn style="font-size:13px;color:var(--sub)">尚未選擇檔案</span></div>
 <input type=file id=fl hidden accept=".txt,.json,text/plain,application/json" multiple><textarea id=pt rows=4 placeholder="或直接貼上內容"></textarea><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class=pri id=im>匯入</button></div></div></div>`,true);
 const q=s=>app.querySelector(s),show=(fn,text)=>{q('#exo').innerHTML=`<label>${fn}</label><textarea rows=4 readonly id=out>${esc(text)}</textarea><div class=row style="margin:6px 0 0"><button class=pri id=dl>下載</button><button class=sec id=cp>複製</button></div>`;
  q('#dl').onclick=async()=>{try{const d=window.claude&&await claude.use('downloads');if(!d)throw 0;await d.save({filename:fn,data:text})}catch(e){if(!e||e.code!='declined')toast('無法直接下載，請改用「複製」')}};
  q('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('已複製')}catch(e){q('#out').select();toast('請手動複製')}}};
 q('#fl').onchange=()=>{const f=q('#fl').files;q('#fn').textContent=f.length?(f.length==1?f[0].name:`已選 ${f.length} 個檔案`):'尚未選擇檔案'};
 q('#e1').onclick=()=>{const ids=[...app.querySelectorAll('.ck input:checked')].map(i=>i.value);if(!ids.length)return toast('請先勾選題庫');show('題庫.txt',toTxt(S.decks.filter(d=>ids.includes(d.id))))};
 q('#e2').onclick=()=>show('學習記錄_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'fillblank',v:3,decks:S.decks,folders:S.folders,prog:S.prog,reps:S.reps,reports:S.reports,cs:S.cs,total:S.total,cfg:S.cfg}));
 q('#im').onclick=async()=>{const items=[];for(const f of q('#fl').files)items.push([await f.text(),f.name.replace(/\.\w+$/,'')]);if(q('#pt').value.trim())items.push([q('#pt').value,'匯入題庫']);if(!items.length)return toast('請選擇檔案或貼上內容');
  let n=0;for(const [t,name] of items){if(t.trim()[0]=='{'){let j;try{j=JSON.parse(t)}catch(e){toast('JSON 格式錯誤');return}
    if(!j.decks)return toast('不是有效的學習記錄');
    return yes('匯入學習記錄會取代目前所有題庫、進度與報告，確定嗎？',()=>{S={...S,decks:j.decks,folders:j.folders||[],prog:j.prog||{},reps:j.reps||{},reports:j.reports||[],cs:j.cs,total:j.total,cfg:{...S.cfg,...(j.cfg||{})},seeded:1};fix();applyTheme();save();home();toast('學習記錄已還原')})}
   n+=importTxt(t,name)}
  fix();save();toast(`已匯入 ${n} 題`);IOB()}}
/* ===== 多題庫練習 ===== */
let MS=new Set(),MQ='';
function multi(){view='multi';MS=new Set();MQ='';
 setView(`<div class=wrap><div class=top><div class=row>${B('home','back')}<h3 class=lt>多題庫練習</h3></div><input class=ti id=mq type=text placeholder="搜尋題庫" ${NOSUG} style="margin-top:8px"></div>
 <div class=row style="margin:8px 0"><button class=sec data-act=msall>${I('select',16)}全選目前篩選結果</button><span id=mc style="font-size:13px;color:var(--sub)"></span></div><div id=ml></div>
 <div style="position:sticky;bottom:14px;display:flex;justify-content:center;margin-top:16px"><button class=pri data-act=mgo>開始練習</button></div></div>`,true);mdraw()}
const mlist=()=>{const q=MQ.trim().toLowerCase();return S.decks.filter(d=>d.cards.length&&(!q||d.title.toLowerCase().includes(q)))};
function mdraw(){$('#ml').innerHTML=mlist().map(d=>{const f=S.folders.find(f=>f.id==d.folder);return `<label class="ck rr" style="padding:12px 16px;cursor:pointer"><input type=checkbox data-d=${d.id} ${MS.has(d.id)?'checked':''}><span style="flex:1;font-size:16px">${esc(d.title)}<br><small style="color:var(--sub);font-size:12px">${f?esc(f.name)+'・':''}${d.cards.length} 題</small></span></label>`}).join('')||'<div class=center>找不到符合的題庫</div>';$('#mc').textContent=`已選 ${MS.size} 個題庫`}
app.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.d;if(view=='multi'&&id){e.target.checked?MS.add(id):MS.delete(id);$('#mc').textContent=`已選 ${MS.size} 個題庫`}});
function msall(){const L=mlist(),all=L.length&&L.every(d=>MS.has(d.id));L.forEach(d=>all?MS.delete(d.id):MS.add(d.id));mdraw()}
function mgo(){const ds=S.decks.filter(d=>MS.has(d.id)&&d.cards.length);if(!ds.length)return toast('請先選擇題庫');const own={};ds.forEach(d=>d.cards.forEach(c=>own[c.id]=d.id));
 const pr=new Proxy({},{get:(t,k)=>(S.prog[own[k]]||{})[k],set:(t,k,v)=>{if(own[k])(S.prog[own[k]]||(S.prog[own[k]]={}))[k]=v;return true},deleteProperty:(t,k)=>{if(S.prog[own[k]])delete S.prog[own[k]][k];return true}});
 startDlg({id:'multi:'+ds.map(d=>d.id).sort().join(','),title:`多題庫練習（${ds.length} 個題庫）`,cards:ds.flatMap(d=>d.cards),parts:ds},pr)}
/* ===== 事件 ===== */
app.addEventListener('click',e=>{if(lpDone){lpDone=false;return}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(view=='edit'&&E.sel){if(a=='tg')togSel(b.closest('.er'));else if(a=='sall'){const rs=[...app.querySelectorAll('.er')],all=rs.every(r=>E.sel.has(r.dataset.cid));rs.forEach(r=>{if(all==E.sel.has(r.dataset.cid))togSel(r)})}
  else if(a=='scan')selMode(false);else if(a=='sdel'){if(!E.sel.size)return toast('尚未選取題目');yes(`刪除已選的 ${E.sel.size} 題？`,()=>{const ids=new Set(E.sel),rows=[...app.querySelectorAll('.er.picked')];
   fadeOut(rows,()=>flip($('#list'),()=>{E.cards=E.cards.filter(c=>!ids.has(c.id));rows.forEach(r=>r.remove());selMode(false);renum();emp()}))})}return}
 if(a=='tog'){const f=S.folders.find(x=>x.id==id);f.open=f.open===false;b.parentNode.classList.toggle('open',f.open);save()}
 else if(a=='home')home();else if(a=='back')back();else if(a=='new')edit();else if(a=='edit')edit(id);else if(a=='start')start(id);
 else if(a=='dmore')dmore(id);else if(a=='fmore')fmore(id);else if(a=='io')io(view=='profile'?profile:home);else if(a=='iback')IOB();else if(a=='multi')multi();else if(a=='msall')msall();else if(a=='mgo')mgo();else if(a=='cfg')cfg();
 else if(a=='prof')profile();else if(a=='orec')records();else if(a=='oerr')errors();else if(a=='emake')errPick([]);else if(a=='edet')detail(b.dataset.cid);
 else if(a=='orep'){const r=S.reports.find(x=>x.id==id);showReport(r,false,records)}else if(a=='rback')RB();
 else if(a=='nf')ask('資料夾名稱','',v=>hlUpdate(()=>{S.folders.push({id:uid(),name:v,open:true});save()}));
 else if(a=='next')nextCard();else if(a=='rnext')profile(false);else if(a=='chk')checkAll();else if(a=='show')showAns();
 else if(a=='pstar'){const c=P.d.cards.find(x=>x.id==P.id);c.star=!c.star;save();b.classList.toggle('on',c.star)}
 else if(a=='rstar'){const c=S.decks.find(x=>x.id==b.dataset.d).cards.find(x=>x.id==b.dataset.c);c.star=!c.star;save();b.classList.toggle('on',c.star)}
 else if(a=='estar'){const c=cardOf(rowOf(b));c.star=!c.star;b.classList.toggle('on',c.star)}
 else if(a=='tg'){const r=b.closest('.er'),o=r.classList.contains('open');app.querySelectorAll('.er.open').forEach(x=>x.classList.remove('open'));if(!o){r.classList.add('open');touch(r.dataset.cid)}}
 else if(a=='mix')mix();else if(a=='selb')selMode(true);
 else if(a=='add'){const c=newCard();touch(c.id);E.cards.push(c);E.open=E.cards.length-1;app.querySelectorAll('.er.open').forEach(x=>x.classList.remove('open'));
  $('#list').insertAdjacentHTML('beforeend',rowHTML(c,E.cards.length-1,true));const r=$('#list').lastElementChild;r.classList.add('open');emp();r.scrollIntoView({behavior:'smooth',block:'center'})}
 else if(a=='rm'){const r=rowOf(b),c=cardOf(r),go=()=>fadeOut(r,()=>flip($('#list'),()=>{E.cards=E.cards.filter(x=>x!==c);if(E.cur==c.id)E.cur=null;r.remove();renum();emp()}));c.en||c.zh?yes('刪除這一題？',go):go()}
 else if(a=='ai')bulk('ai');else if(a=='local')bulk('local');
 else if(a=='saveDeck'){if(saveDeck()){home();toast('已儲存')}}});
home();
</script></body></html>
