 第 r 輪的目標是每題累積 r 次答對；上一輪沒達標的題目不進入主序列，而是「每隔一題」插入，直到補到本輪目標。
 最後一輪結束後輪流複習剩下的題目，直到全部達標。 */
const PB=5,qc=id=>P.pr[id]||0;
const qOut=Q=>{const s=new Set([...Q.seen,...Q.bh]);return Q.order.filter(id=>s.has(id)&&qc(id)<Q.r)};
function qInit(order,R){return{order,R,r:0,mq:[],bh:[],bp:0,seen:[],q:[],st:'newround'}}
function qFill(Q){for(let g=0;g<500;g++){
 if(Q.st=='newround'){Q.r++;if(Q.r>Q.R)return false;Q.mq=Q.order.filter(id=>qc(id)==Q.r-1);Q.bh=Q.order.filter(id=>qc(id)<Q.r-1);Q.seen=[];Q.bp=0;Q.st='batch';continue}
 if(Q.st=='batch'){if(Q.mq.length){const b=Q.mq.splice(0,PB),hb=Q.bh.some(id=>qc(id)<Q.r);Q.seen.push(...b);Q.q=b.flatMap(id=>hb?[id,'*']:[id]);Q.st='review';return true}Q.st='endrev';continue}
 if(Q.st=='review'){Q.st='batch';const L=qOut(Q);if(L.length){Q.q=L;return true}continue}
 if(Q.st=='endrev'){const L=qOut(Q);if(Q.r<Q.R){Q.st='newround';if(L.length){Q.q=L;return true}continue}if(!L.length)return false;Q.q=L;return true}}
 return false}
function qNext(Q){for(let g=0;g<500;g++){if(!Q.q.length&&!qFill(Q))return null;const x=Q.q.shift();if(x!=='*')return x;
 const L=Q.bh.filter(id=>qc(id)<Q.r);if(!L.length)continue;return L[(Q.bp++)%L.length]}return null}

{"f": "col", "t": "如何新增搭配詞例句填空題庫", "ic": "edit", "d": "句子挖空題：手動輸入、貼上文字自動生成、管理題庫", "b": [["p", "一個題庫由多道填空題組成。每題一定要有「英文句子（用 [ ] 標出挖空處）」和「中文句子」；單字/片語、翻譯與筆記是選填。"], ["h", "方法一：手動逐題新增"], ["s", [["在首頁左上角按「題庫」，在詢問視窗選擇「搭配詞例句填空題庫」，進入題庫編輯頁。", "要新增單字例句填空題庫或混搭題庫，請看「如何新增單字例句填空題庫」。"], ["在最上方「題庫標題」欄輸入名稱。", "沒填的話會存成「未命名題庫」。"], ["按上方「新增」，會多出一題並自動展開。"], ["在「英文句子」輸入完整句子，並用 `[ ]` 框住要挖空的字。", "[ ] 裡如果有多個字，每個字會各自變成一個格子。"], ["在「中文句子」輸入翻譯，作答時會顯示在英文句子下方。", "可以用 [ ] 框住對應挖空處的中文詞（不一定要用），作答時會加底線提示該填什麼；但「中文句子」本身一定要填。"], ["選填：「單字/片語」與「翻譯」會在答對後顯示；「筆記」可寫文法提醒。"], ["點題目那一列可展開／收合；列右側的星號可標註重點題、垃圾桶可刪除該題。"], ["全部完成後，按右上角「儲存」。", "有未儲存的變更時按返回箭頭，系統會詢問是否儲存。"]]], ["c", "英文句子輸入範例（含 [ ] 挖空）", "Kyle [was] deeply [upset about] not winning first place in the swimming race."], ["c", "中文句子輸入範例（[ ] 為選填的提示）", "Kyle 對於沒有贏得游泳比賽第一名，感到非常[難過]。"], ["t", "題目缺英文／中文、沒有 [ ] 挖空，或與同題庫的題目重複時，該題會以紅色標示，且無法儲存。依紅字提示修正即可。"], ["h", "方法二：貼上文字自動生成"], ["s", [["在編輯頁按「自動生成題庫」展開輸入區。"], ["每行貼上一題（格式見下方範例）。"], ["按「判定並加入」。", "不符合規則或重複的題目會自動刪除，並顯示刪除題數。"], ["檢查新加入的題目無誤後，按「儲存」。"]]], ["c", "自動生成輸入範例（每行一題）", "The loud music ______ the whole family ______ all night.（鄰居派對太吵，[讓]這家人整夜[睡不著]。）｜答案：kept awake（keep... awake 讓……睡不著）\nKyle ______ deeply ______ ______ not winning first place.（Kyle 對於沒有贏得第一名感到非常[難過]。）｜答案：was upset about"], ["p", "如果手上有 PDF、Word 或圖片，可以請 AI 幫你整理成這個格式，詳見「使用AI提示詞來生成搭配詞題庫」。"], ["h", "整理與管理"], ["s", [["首頁題庫卡片右上角的「⋯」：上移、下移、移到資料夾、重置學習進度、刪除題庫、查看過往練習報告。"], ["首頁「資料夾」可建立資料夾，把題庫分類收納。"], ["題庫超過 3 個時，首頁會出現「搜尋題庫」欄。"], ["編輯頁要一次刪除多題：按「選取」（或長按任一題），勾選後按「刪除」。"]]], ["t", "作答的方法、批改顏色與設定，請看「搭配詞題怎麼作答」。"]]},
{"f": "col", "t": "搭配詞題怎麼作答", "ic": "play", "d": "設定項目、輸入方式、中文底線提示、批改顏色", "b": [["p", "搭配詞題是整句英文挖空，下方有中文翻譯。這一頁說明畫面、輸入方式與批改結果。"], ["h", "開始練習的設定"], ["s", [["搭配詞例句填空題庫：練習範圍、打亂順序、填空提示、每題需答對次數、格子長度提示（預設開啟）。", "填空提示：中文句子裡用 [ ] 框住的詞會加底線。"], ["練習範圍、打亂順序、每題需答對次數的用法，以及接續、記住上次設定，請看「如何開始與接續練習」。"]]], ["p", "「格子長度提示」開啟時，格子寬度對應答案長度；關閉時一律是 6 個字母寬。"], ["p", "畫面上方是題庫名稱；卡片裡英文句子的挖空處是一個個格子，下方是中文翻譯；右上角星號可標註這題。卡片下方的進度條是整體進度，右邊的圓點是這題已答對的次數。"], ["h", "中文句子的底線提示"], ["l", [["<span class=zu style=\"font-size:17px\">難過</span>", "中文句子裡有底線的字，就是對應英文挖空的詞，提示這格要填什麼。需要在開始練習的設定視窗開啟「填空提示」，題目也要有用 [ ] 框住的中文詞。"]]], ["h", "如何輸入"], ["s", [["點一下格子輸入答案，不分大小寫。", "在開始練習的設定視窗開啟「格子長度提示」時，格子寬度對應答案長度；關閉時，格子一律是 6 個字母的寬度。"], ["每個格子只填一個字；片語會被拆成多個格子。", "輸入的字比格子預設寬度長時，格子會跟著變長；刪除時會跟著變短，最短回到預設寬度。按「看答案」時，如果答案比預設寬度長，格子也會跟著變長。填空格子會要求手機使用英文鍵盤；電腦版的輸入法無法由網頁自動切換（網頁沒有這個權限），請先自行切到英文再作答。"], ["輸入完一格後按空白鍵或 Enter，會跳到下一個尚未答對的格子；在最後一格按下，會自動檢查。"], ["也可以隨時按右下角「檢查」。"], ["不確定時按「看答案」，所有未答對的格子會顯示正確答案，這題會記為答錯。"]]], ["h", "批改結果的顏色"], ["l", [["<span class=\"dm ok\">awake</span>", "綠底格子：這格答對了，會自動鎖定，不能再修改。"], ["<span class=dm><b class=g>a</b><b class=g>w</b><b class=g>a</b><b class=g>k</b></span>", "藍色字：你輸入對的字母。"], ["<span class=dm><b class=r>e</b></span>", "紅色字：正確答案中，你寫錯或漏掉的字母，這裡顯示的是正確字母。"]]], ["p", "綜合範例："], ["l", [["<span class=dm><b class=g>a</b><b class=g>w</b><b class=g>a</b><b class=r>k</b><b class=g>e</b></span>", "答案 awake，你輸入 awaje：k 寫錯，顯示紅色的正確字母 k。"], ["<span class=dm><b class=g>k</b><b class=g>e</b><b class=g>p</b><b class=g>t</b></span>", "答案 kept，你輸入 kepts：多打的 s 不會顯示，會直接被刪除，只留下正確答案的字母。"]]], ["t", "答錯的格子不用手動刪除，直接點進去重新輸入即可，舊內容會自動全選並被取代。全部答對後，下方會顯示這題的單字/片語與筆記，按「繼續」進入下一題。"], ["t", "答完後解析下方會出現獨立的「筆記」欄位，見「答完後的筆記與星號」。"]]},
{"f": "vocab", "t": "如何新增單字例句填空題庫與混搭題庫", "ic": "book", "d": "欄位說明、字首字尾設定、自動判定格式、混搭題庫", "b": [["p", "單字例句填空題庫用來練習「單一個單字」的填空。和搭配詞例句填空題庫不同的地方：作答時不會顯示句子翻譯，格子的最前端和最後端會有該單字的字首、字尾提示（格子寬度預設 6 個字母，開啟「格子長度提示」則依答案長度）。"], ["t", "作答的方法與三種單字提示，請看「單字例句題的作答與提示」。"], ["h", "新增單字例句填空題庫"], ["s", [["在首頁左上角按「題庫」，選擇「單字例句填空題庫」。", "如果想把搭配詞題和單字例句題放在同一個題庫，請選「混搭題庫」。"], ["在最上方「題庫標題」輸入名稱，按「新增」新增一題。"], ["「英文句子」（必填）：輸入句子，用 `[ ]` 框住要考的單字。", "框住的是句子裡實際出現的形式，例如 realized、presented、messages。"], ["「單字解釋」（必填）：建議寫成「單字原形 (詞性) 中文意思」，例如 `unique (adj.) 獨有的`。", "答對後，這段會顯示在原本「單字/片語」的位置；開頭的英文原形也會當作字首、字尾提示的判斷依據（沒寫原形也可以）。"], ["「句子翻譯」（選填）：可以用 `[ ]` 框住對應的中文詞，顯示答案時會加底線標出。", "作答時不會顯示句子翻譯；顯示答案時（答對後，或按「看答案」），有填才會出現在英文句子下方，沒填就不顯示。"], ["「搭配詞/片語」、「搭配詞/片語 翻譯」、「筆記」都是選填。"], ["全部完成後，按右上角「儲存」。"]]], ["c", "範例 1：一般單字例句題（沒有搭配詞與筆記）", "英文句子：Every person’s fingerprints are [unique]. No two people’s are alike.\n單字解釋：(adj.) 與眾不同的\n句子翻譯：每個人的指紋都是[獨一無二的]。沒有人是相同的。\n搭配詞/片語：（無）\n搭配詞/片語 翻譯：（無）\n筆記：（無）"], ["c", "範例 2：含搭配詞與筆記", "英文句子：Kiwi birds are [unique] to New Zealand. Nowhere else you can find them.\n單字解釋：(adj.) 獨有的\n句子翻譯：奇異鳥[為]紐西蘭[所獨有]，其他地方都找不到。\n搭配詞/片語：be unique to + 地方\n搭配詞/片語 翻譯：為某地方所獨有\n筆記：=be native to + 地方"], ["h", "設定提示的字首與字尾"], ["p", "在單字例句題的編輯區，英文句子下方會把 [ ] 裡的單字拆成一顆顆字母按鈕。系統會自動偵測並設好字首與字尾（變色的字母），你也可以自己點字母調整。"], ["s", [["用 `[ ]` 框住單字，例如 `[items]`，下方會出現 i、t、e、m、s 五顆按鈕。"], ["點一下字母就選取／取消。例如選了 i、m、s：系統依位置判定，i 在最前面是字首，m、s 連到最後面是字尾，所以字首是 i、字尾是 ms。"], ["被選為提示的字母會變色；題目列的預覽和編輯區的「預覽」，也會用同樣的顏色標出字首和字尾。"], ["不在最前面或最後面連續位置的字母（例如只選中間的 t）不會成為提示，按鈕只會顯示虛線框。"], ["想回到自動偵測，按「恢復自動」。"]]], ["t", "手動設定的字母，會在開始練習選擇「字首＋字尾（完整提示）」時使用；選「一字提示」或「僅提示字首」時，仍依該選項的規則（只給第一個與最後一個字母，或只給第一個）。"], ["h", "貼上文字自動生成"], ["s", [["在單字例句填空題庫的編輯頁按「自動生成題庫」展開輸入區。"], ["每行貼上一題，用「｜」分成三段（格式見下方範例）。"], ["按「判定並加入」，系統會自動分出英文句子、單字解釋、句子翻譯、搭配詞與搭配詞翻譯。", "自動判定出的「單字解釋」會連原形單字一起放進去，例如第二段 `unique (adj.) 獨有的`，單字解釋就是 `unique (adj.) 獨有的`。"], ["檢查加入的題目後按「儲存」。"]]], ["c", "自動生成輸入範例（每行一題）", "Kiwi birds are [unique] to New Zealand. Nowhere else you can find them.（奇異鳥[為]紐西蘭[所獨有]，其他地方都找不到。）｜unique (adj.) 獨有的｜be unique to + 地方（為某地方所獨有）\nShe realized that she had left her wallet at home.（她發覺自己把錢包忘在家裡了。）｜realize (v.) 了解"], ["p", "三段依序是：「英文句子（句子翻譯）」、「單字原形 (詞性) 解釋」、「搭配詞（翻譯）」；第三段沒有可以省略。句子翻譯使用全形或半形括號都可以。第二段會完整放進「單字解釋」（含英文原形，如 `unique (adj.) 獨有的`），原形也會當作字尾提示的判斷依據。"], ["t", "英文句子不一定要先用 [ ] 框好：系統會用第二段的單字原形，在句子裡找出對應的字（含三單、過去式、複數、-ing 等變化，如上例的 realized）並自動加上 [ ]。找不到的題目會被自動刪除，並顯示刪除題數。"], ["h", "混搭題庫"], ["s", [["按「題庫」選擇「混搭題庫」。"], ["在編輯頁按「新增」時，會先問你要新增「搭配詞題」還是「單字例句題」。"], ["按「混編」可以從所有題庫加入題目，搭配詞題與單字例句題都可以。"], ["開始練習時，設定視窗會分成「通用」、「搭配詞題」、「單字例句題」三個分頁，依序設定、按「下一步」換頁；作答時題目上方會標示這題的題型。"]]], ["t", "「混搭題庫」和「混編」不同：混搭題庫是一種題庫類型，可同時放兩種題目；「混編」是把其他題庫的題目複製進來，但搭配詞例句填空題庫只能加搭配詞題、單字例句填空題庫只能加單字例句題。"]]},
{"f": "vocab", "t": "單字例句題的作答與提示", "ic": "play", "d": "三種單字提示、填空提示、句子翻譯標註、作答細節", "b": [["p", "單字例句題是在句子裡把一個單字挖空，格子前後給你字首、字尾提示；作答時不會顯示句子翻譯。"], ["h", "開始練習的設定"], ["s", [["單字例句填空題庫：練習範圍、打亂順序、單字提示（字首＋字尾完整提示／一字提示／僅提示字首）、填空提示（顯示單字解釋，預設關閉）、句子翻譯標註單字解釋、每題需答對次數、格子長度提示（預設關閉）。"], ["練習範圍、打亂順序、每題需答對次數的用法，以及接續、記住上次設定，請看「如何開始與接續練習」。"]]], ["p", "「格子長度提示」開啟時，格子寬度對應答案長度；關閉時一律是 6 個字母寬（單字例句題預設關閉）。「填空提示（顯示單字解釋）」開啟時，題目下方會直接顯示單字解釋。「句子翻譯標註單字解釋」開啟時，顯示答案後的句子翻譯裡，用 [ ] 框住的詞會加底線。"], ["h", "單字提示（開始練習時選擇）"], ["p", "開始練習時，設定視窗會出現「單字提示」，有三種可選。提示會顯示在格子的最前端與最後端；開始輸入時提示會消失，格子清空後會再次出現。"], ["l", [["<span class=dm style=\"min-width:118px;justify-content:space-between;gap:10px\"><span style=\"opacity:.6;font-size:.8em;align-self:center\">字</span><span style=\"opacity:.6;font-size:.8em;align-self:center\">尾</span></span>", "字首＋字尾（完整提示）：字首給一個字母，字尾通常也給一個字母；如果單字有 es、ies、ed、ied 的變化結尾，會完整顯示變化結尾，有時再多顯示一個字母。"], ["<span class=dm style=\"min-width:118px;justify-content:space-between;gap:10px\"><span style=\"opacity:.6;font-size:.8em;align-self:center\">m</span><span style=\"opacity:.6;font-size:.8em;align-self:center\">es</span></span>", "messages（名詞複數）→ 字首 m、字尾 es"], ["<span class=dm style=\"min-width:118px;justify-content:space-between;gap:10px\"><span style=\"opacity:.6;font-size:.8em;align-self:center\">p</span><span style=\"opacity:.6;font-size:.8em;align-self:center\">ted</span></span>", "presented（動詞過去式）→ 字首 p、字尾 ted"], ["<span class=dm style=\"min-width:118px;justify-content:space-between;gap:10px\"><span style=\"opacity:.6;font-size:.8em;align-self:center\">r</span><span style=\"opacity:.6;font-size:.8em;align-self:center\">ed</span></span>", "realized（原形字尾是 e，只加 d）→ 字首 r、字尾 ed"], ["<span class=dm style=\"min-width:118px;justify-content:space-between;gap:10px\"><span style=\"opacity:.6;font-size:.8em;align-self:center\">r</span><span style=\"opacity:.6;font-size:.8em;align-self:center\">lied</span></span>", "replied（去 y 加 ied）→ 字首 r、字尾 lied"], ["<span class=dm style=\"min-width:118px;justify-content:space-between;gap:10px\"><span style=\"opacity:.6;font-size:.8em;align-self:center\">字</span><span style=\"opacity:.6;font-size:.8em;align-self:center\">尾</span></span>", "字首＋字尾（一字提示）：不管有沒有變化，都只提示字首與字尾各一個字母。"], ["<span class=dm style=\"min-width:118px;justify-content:space-between;gap:10px\"><span style=\"opacity:.6;font-size:.8em;align-self:center\">字</span><span style=\"opacity:.6;font-size:.8em;align-self:center\"></span></span>", "僅提示字首：只顯示字首一個字母。"]]], ["t", "字尾提示是依單字的外型判斷：有英文原形（自動生成時的第二段，或手動輸入時單字解釋開頭寫的原形）判斷最準確；沒有原形的題目則依 es／ed 等結尾的常見規則推測，少數不規則的字可能和預期不同，這時可以手動設定提示字母。"], ["h", "作答細節"], ["s", [["格子最前端是字首提示、最後端是字尾提示（依「單字提示」設定）；格子寬度依「格子長度提示」決定。"], ["開啟「填空提示（顯示單字解釋）」時，題目下方會直接顯示單字解釋（白色框），開頭的英文原形會先隱去以免洩漏答案；答對後不會再重複顯示。"], ["開始輸入時提示會消失；把格子清空，提示會再次出現。"], ["單字例句題作答時，卡片上只有英文句子，不會顯示句子翻譯；顯示答案時（填對後或按「看答案」），若題目有填句子翻譯，會出現在英文句子下方；填對後再顯示單字解釋，以及搭配詞／片語與筆記。"]]], ["t", "輸入方式、批改顏色（綠底、藍字、紅字）和搭配詞題相同，請看「搭配詞題怎麼作答」。混搭題庫作答時，題目上方會標示這題是「搭配詞題」還是「單字例句題」。"], ["t", "答完後解析下方會出現獨立的「筆記」欄位，見「答完後的筆記與星號」。"]]},
{"f": "word", "t": "單字題庫：新增與編輯", "ic": "list", "d": "欄位說明、多個解釋、解釋區塊收合、黃色與綠色星星", "b": [["p", "單字題庫用來背「單字本身」：一邊是英文單字，另一邊是中文解釋，每個解釋還可以附上專屬的例句。練習方式有「選擇題」和「筆試」兩種，和「單字例句填空題庫」（在句子裡把單字挖空）不同。"], ["h", "新增單字題庫"], ["s", [["在首頁左上角按「題庫」，選擇「單字題庫」。"], ["輸入「題庫標題」，按「新增」新增一題。"], ["「英文單字」（必填）：例如 `unique`。"], ["「單字翻譯」（必填）：一次輸入一個解釋，詞性加中文意思，例如 `(adj.) 獨有的`。"], ["「例句」（選填）：這個解釋專屬的例句，可以用 `[ ]` 框住句子裡的單字，顯示時會加粗並畫底線。"], ["「例句翻譯」（選填）：這個解釋例句的翻譯，可以用 `[ ]` 框住對應的中文詞，顯示時會加底線。"], ["單字有多個解釋時，按下方的「新增解釋」，就會多出一個解釋區塊，每個區塊都有自己的單字翻譯、例句與例句翻譯；區塊右上角的垃圾桶可以單獨刪除這個解釋（至少要保留一個），旁邊的綠色星星可以單獨標註這個解釋。", "每個解釋區塊的標題列會顯示「解釋 n」和這個解釋的預覽，解釋區塊預設是收合的，點標題列就能展開或收合；新增的解釋會自動展開；區塊裡的欄位和上方「英文單字」一樣寬。"], ["單字列上的星星有三種狀態：沒有標註時是空心星星；只標註部分解釋時顯示綠色星星；所有解釋都標註時是黃色星星。點綠色星星會變成黃色星星，並把所有解釋都標上綠色星星；再點一下就全部取消。每個解釋都標上綠色星星時，單字會自動變成黃色星星。"], ["「筆記」（選填）。"], ["完成後按右上角「儲存」。"]]], ["c", "單字題範例", "英文單字：unique\n單字翻譯：(adj.) 獨有的\n例句：Kiwi birds are [unique] to New Zealand. Nowhere else you can find them.\n例句翻譯：奇異鳥[為]紐西蘭[所獨有]，其他地方都找不到。"], ["c", "多個解釋的單字範例", "英文單字：address\n解釋 1：(n.) 住址\n　例句：She wrote her new [address] in the notebook.\n　例句翻譯：她在筆記本上寫下了她的新[住址]。\n解釋 2：(v.) 發言\n　例句：The president will [address] the nation tonight.\n　例句翻譯：總統將於今晚向全國[發表演說]。"], ["h", "編輯頁的其他操作"], ["s", [["「新增」：再加一個單字；「選取」（或長按任一單字）：勾選多個單字，按「刪除」一次刪掉。"], ["「混編」：從其他單字題庫把單字複製進來（單字題庫只能加單字題庫的單字）。"], ["單字缺英文、缺單字翻譯、只填了例句卻沒填翻譯，或與同題庫的單字重複時，該單字會用紅字標示，且無法儲存；依紅字提示修正即可。", "儲存時，完全空白的解釋區塊會自動刪除。"], ["有未儲存的變更時按返回箭頭，系統會詢問是否儲存。"]]], ["t", "如果某個單字的所有解釋被寫在同一個區塊裡（例如貼成「(vt.) 准許，允許 (vi.) 准許，允許 (n.) 許可證」一整串），載入與儲存時，系統會依 (詞性) 自動拆成多個解釋；「(v./n.)」這種把兩個詞性寫在同一個括號裡的標示，也算一個詞性標示。"], ["t", "要用 AI 整理成單字題庫，見「使用 AI 整理題庫」資料夾裡的「使用AI提示詞來生成單字題庫」。"]]},
{"f": "word", "t": "單字題庫：貼上文字自動生成", "ic": "spark", "d": "「英文單字｜解釋｜例句｜翻譯」的格式，1 個、2 個、3 個以上解釋都一樣", "b": [["p", "在單字題庫的編輯頁可以一次貼上很多單字，系統會自動分出英文單字、每個解釋，以及各解釋專屬的例句與例句翻譯。"], ["h", "步驟"], ["s", [["在單字題庫的編輯頁按「自動生成題庫」，再點開「格式說明與範例」。"], ["每行貼上一個單字，用「｜」分段：英文單字｜單字翻譯｜例句｜例句翻譯（格式見下方範例）。"], ["單字可以有 1 個、2 個、3 個或更多解釋，規則都一樣：把所有解釋接在同一段（用 `(詞性)` 區分），之後依解釋的順序，每個解釋的例句與例句翻譯成對接在後面；有幾個解釋，就接幾組。三個解釋的格式是：`英文單字｜解釋1 解釋2 解釋3｜解釋1的例句｜解釋1的例句翻譯｜解釋2的例句｜解釋2的例句翻譯｜解釋3的例句｜解釋3的例句翻譯`。"], ["按「判定並加入」，系統會自動分出英文單字、每個解釋，以及各解釋專屬的例句與例句翻譯。"], ["檢查加入的題目後按「儲存」。"]]], ["h", "格式說明"], ["p", "每一行是一個單字，用「｜」分段。單字可以有 1 個、2 個、3 個或更多解釋，規則都一樣：所有解釋接在同一段（用 `(詞性)` 區分），之後依解釋的順序，每個解釋的例句與例句翻譯成對接在後面；有幾個解釋，就接幾組。"], ["c", "一個解釋", "英文單字｜單字翻譯｜例句｜例句翻譯"], ["c", "兩個解釋", "英文單字｜單字翻譯1 單字翻譯2｜翻譯1的例句｜翻譯1的例句翻譯｜翻譯2的例句｜翻譯2的例句翻譯"], ["c", "三個解釋", "英文單字｜單字翻譯1 單字翻譯2 單字翻譯3｜翻譯1的例句｜翻譯1的例句翻譯｜翻譯2的例句｜翻譯2的例句翻譯｜翻譯3的例句｜翻譯3的例句翻譯"], ["c", "自動生成輸入範例（每行一個單字）", "unique｜(adj.) 獨有的｜Kiwi birds are [unique] to New Zealand. Nowhere else you can find them.｜奇異鳥[為]紐西蘭[所獨有]，其他地方都找不到。\npermit｜(vt.) 准許，允許 (vi.) 准許，允許 (n.) 許可證\naddress｜(n.) 住址 (v.) 發言｜She wrote her new address in the notebook.｜她在筆記本上寫下了她的新住址。｜The president will address the nation tonight.｜總統將於今晚向全國發表演說。\naddress｜(n.) 住址 (v.) 發言｜｜｜The president will address the nation tonight.｜總統將於今晚向全國發表演說。\npermit｜(vt.) 准許，允許 (vi.) 准許，允許 (n.) 許可證｜The school does not permit phones in class.｜學校不准在課堂上使用手機。｜｜｜She applied for a work permit.｜她申請了工作許可證。"], ["h", "判定結果怎麼對應"], ["c", "這一行（permit 有三個解釋，第二個解釋沒有例句）", "permit｜(vt.) 准許，允許 (vi.) 准許，允許 (n.) 許可證｜The school does not permit phones in class.｜學校不准在課堂上使用手機。｜｜｜She applied for a work permit.｜她申請了工作許可證。"], ["c", "會判定成", "單字：permit\n解釋 1：(vt.) 准許，允許\n　例句：The school does not permit phones in class.\n　例句翻譯：學校不准在課堂上使用手機。\n解釋 2：(vi.) 准許，允許\n　（沒有例句）\n解釋 3：(n.) 許可證\n　例句：She applied for a work permit.\n　例句翻譯：她申請了工作許可證。"], ["t", "某個解釋沒有例句時，那一組的例句與例句翻譯留空（連續兩個「｜」）；整個單字都沒有例句，就整段省略，例如 `permit｜(vt.) 准許，允許`。"], ["t", "例句沒有用 [ ] 框住單字時，系統會自動找出該單字（含三單、過去式、複數、-ing 等變化形）並加上 [ ]。翻譯沒有 (詞性) 標示、只用空白分開的幾個中文詞（例如「住址 發言」），也會拆成兩個解釋。"], ["t", "如果例句的數量比解釋多，多出來的部分會併進最後一個解釋的例句翻譯，不會被丟掉。"], ["t", "在編輯頁的「自動生成題庫」裡點開「格式說明與範例」，也可以直接看到這些範例。"]]},
{"f": "word", "t": "單字題庫：選擇題", "ic": "select", "d": "設定、每個解釋都要練習、星星規則、解析與回合", "b": [["p", "選擇題是看題目選答案：題目可以是英文單字（選出中文解釋），也可以是中文解釋（選出英文單字）。"], ["h", "設定與出題"], ["s", [["設定：練習範圍、打亂順序，以及「選項為中文」、「選項為英文」兩個開關。", "練習範圍有五個選項：練習所有題目、僅練習標註黃色星星的題目、僅練習未標註黃色星星的題目、僅練習標註綠色星星的解釋、僅練習未標註綠色星星的解釋（畫面上用星星圖示表示）。黃色星星是整個單字（所有解釋都標了綠色星星），綠色星星是單一解釋。選「綠色星星」的兩個範圍時，單字的解釋數會顯示在選項旁邊。"], ["單字題庫預設只開「選項為中文」（題目是英文單字，選出中文解釋）；兩個都開時，每個單字會隨機以英文或中文出題；兩個開關不能同時關閉，關掉最後一個時，系統會自動打開另一個。"], ["「每個解釋都要練習」開關（預設關閉）：一個單字有多個解釋時，題目為中文（選項為英文）的題目，會把每個解釋各出一題，例如 permit 有三個解釋就會出三題，所以總題數可能比單字數多；題目為英文（選項為中文）時，則從這個單字的解釋中挑一個當正確選項。", "關閉時，題目與選項會顯示這個單字的所有解釋。開啟後，選項會自動避開解釋和題目相近的其他單字。"], ["「每個解釋都要練習」打開時：題目為中文（選項為英文）→ 總題數等於總解釋數（permit 有三個解釋就出三題）；題目為英文（選項為中文）→ 總題數等於單字數。兩個選項都開時，每個單字會隨機以中文或英文出題，題數是兩種的混合。"], ["練習時題目卡片右上角的星星：題目是中文解釋時顯示綠色星星，開啟「每個解釋都要練習」時對應這一個解釋，標註了才會亮起，點一下可標註或取消；沒開啟時對應這個單字的所有解釋，有任一解釋標註就會亮起。題目是英文單字時顯示黃色星星，只有整個單字都標註（所有解釋都是綠色星星）才會亮起。選擇題與筆試都一樣。"], ["畫面上方是題目（詞語或定義），下面是 4 個選項（單字少於 4 個時選項會變少）。點選項作答，也可以按鍵盤 1～4。", "選項會優先挑字形相近的單字，其次是詞性相同的，最後才隨機；盡量不會出現兩題選項完全一樣。"], ["答對：選項變綠色；答錯：你選的選項是橘色叉叉，正確答案用綠色虛線框標出。「繼續」按鈕會出現在選項下方。", "如果這個單字有例句，選項下方會出現解析（單字、翻譯、例句與例句翻譯）；沒有例句就不會出現解析；開啟「每個解釋都要練習」時，只會顯示這個解釋的例句。每題答完（所有題型都一樣），解析下方都會有獨立的「筆記」欄位：先顯示原有的筆記，點開就能直接編輯，修改會同步到題庫裡的筆記。不確定時按「不知道嗎？」，會直接顯示答案。"], ["每 6～8 題為一回。答錯的題目，會在這一回的題目都做完一輪後再練習一次。"], ["每回結束會出現回合總結：總進度條、這一輪的單字，並可以點星號標註；按「繼續邁向第 N 回」進入下一回。"]]]]},
{"f": "word", "t": "單字題庫：筆試", "ic": "edit", "d": "填寫英文、填寫中文、不知道與提示", "b": [["p", "筆試是自己輸入答案：填寫英文時由系統自動評分，填寫中文時由你自行評分。"], ["h", "設定與作答"], ["s", [["設定：練習範圍、打亂順序、每題需答對次數，以及「填寫英文（自動評分）」、「填寫中文（自行評分）」兩個開關。練習範圍有五個選項，和選擇題相同（所有題目、黃色星星、未標註黃色星星、綠色星星的解釋、未標註綠色星星的解釋）。"], ["筆試的星星：題目是中文解釋時顯示綠色星星，對應這個單字的所有解釋（任一解釋有標註就會亮起，點一下會全部標註或全部取消）；題目是英文單字時顯示黃色星星，只有整個單字都標註才會亮起。"], ["筆試沒有「每個解釋都要練習」開關，題目是中文時，會一次顯示這個單字的所有解釋。"], ["填寫英文（題目是中文）：輸入單字後按「回答」，系統自動評分。答錯時，會用藍色標出對的字母、紅色標出該有的字母，需要重新輸入正確答案才能繼續。"], ["填寫中文（題目是英文）：輸入後按「回答」，系統會顯示正確答案，由你按並排的兩個按鈕自行評分：右邊綠色勾勾是答對，左邊紅色叉叉是答錯。"], ["「不知道」：直接顯示答案，並要求再輸入一次，輸入後答案才會隱藏；這一題會算答錯。"], ["「提示」：顯示答案的第一個字。"], ["手機上進入題目時會自動跳出鍵盤（填英文時為英文鍵盤）；電腦版的輸入法無法由網頁自動切換，請先自行切換。答完後，如果有例句，會顯示例句與「繼續」按鈕。進度圓點與進度條的算法和填空題相同。"]]], ["t", "單字題庫自成一類：「混編」只能加入單字題庫的單字；「多題庫練習」也不能把單字題庫和其他類型的題庫一起選。中途離開的練習，下次按「開始練習」可以選擇「接續上次」並調整設定（練習範圍與每題需答對次數除外），或「重新開始」。"]]},
{"f": "prac", "t": "如何開始與接續練習", "ic": "play", "d": "設定視窗、練習範圍、記住上次設定、接續與重新開始", "b": [["p", "這一頁說明從按下「開始練習」到做完（或中途離開、再接續）的整個流程。"], ["h", "開始練習"], ["s", [["在首頁點題庫的「開始練習」。", "單字題庫要先選練習方式：「選擇題」或「筆試」。"], ["在設定視窗依題型設定，按「開始」。", "設定項目因題型而不同，見下方。"], ["練習中途離開也沒關係，進度與出題順序都會保留。"]]], ["h", "各題型的設定項目"], ["s", [["搭配詞例句填空題庫：練習範圍、打亂順序、填空提示、每題需答對次數、格子長度提示（預設開啟）。", "填空提示：中文句子裡用 [ ] 框住的詞會加底線。"], ["單字例句填空題庫：練習範圍、打亂順序、單字提示（字首＋字尾完整提示／一字提示／僅提示字首）、填空提示（顯示單字解釋，預設關閉）、句子翻譯標註單字解釋、每題需答對次數、格子長度提示（預設關閉）。"], ["混搭題庫或多題庫練習：如果同時有兩種題型，設定會分成三個分頁，設定完一頁按「下一步」換下一頁，最後一頁按「開始」。", "第一頁通用：練習範圍、打亂順序、每題需答對次數；第二頁搭配詞題：填空提示、格子長度提示；第三頁單字例句題：單字提示、填空提示（顯示單字解釋）、句子翻譯標註單字解釋、格子長度提示。"]]], ["s", [["單字題庫：選擇題與筆試各有自己的設定視窗，詳見「單字題庫：選擇題」「單字題庫：筆試」。", "練習範圍有五個選項（所有題目、黃色星星、未標註黃色星星、綠色星星的解釋、未標註綠色星星的解釋）。"]]], ["p", "「格子長度提示」開啟時，格子寬度對應答案長度；關閉時一律是 6 個字母寬。「填空提示（顯示單字解釋）」開啟時，練習單字例句題會直接在題目下方顯示單字解釋。「句子翻譯標註單字解釋」開啟時，顯示答案後的句子翻譯裡，用 [ ] 框住的詞會加底線。"], ["h", "練習範圍"], ["s", [["練習所有題目；僅練習標註星號的題目；僅練習未標註星號的題目（設定視窗中的星號用星星圖示表示）。"], ["選項旁邊會顯示符合的題數；符合的題數是 0 時，該選項無法選取。"]]], ["h", "系統會記住上次的設定"], ["s", [["每個題庫上一次開始練習的設定（練習範圍、打亂順序、每題需答對次數與各種開關），會自動變成下一次的預設，不用每次重新調整。"], ["單字題庫的「選擇題」和「筆試」各自記住自己的設定。"], ["如果上次選的練習範圍現在沒有符合的題目，會改回「練習所有題目」。"], ["單字題庫第一次練習的預設：選擇題只開「選項為中文」、其他開關關閉。"]]], ["h", "接續上次與重新開始"], ["s", [["題庫有未完成的練習時，按「開始練習」會先出現「有未完成的練習」，顯示上次的完成度與設定；多題庫練習還會顯示是哪些題庫結合的。"], ["「接續上次」：回到離開時的進度，並可以調整設定，但「練習範圍」與「每題需答對次數」不能更改（練習範圍會顯示出來但無法選取）。"], ["「重新開始」：放棄上次的練習，重新設定並從頭開始。"], ["單字題庫的選擇題在接續時改變「每個解釋都要練習」，會依新設定重新排題，已經學會的單字不會被重考。"], ["也可以從「檢視所有練習紀錄」裡，在標示「未完成」的紀錄上按「繼續練習」。"]]], ["h", "重置學習進度"], ["s", [["題庫卡片的「⋯」→「重置學習進度」：清除這個題庫的學習進度與未完成的練習（未完成的紀錄會被標記為放棄），可以從零開始。"]]]]},
{"f": "prac", "t": "進度怎麼算", "ic": "chart", "d": "圓點、出題順序、回合，以及各題型的算法", "b": [["p", "每一題要答對幾次才算「學會」，由「每題需答對次數」決定。"], ["h", "填空題（搭配詞、單字例句、混搭）"], ["s", [["整題一次就全部答對，圓點才會多亮一顆；圓點全亮代表這題已學會。有答錯或使用「看答案」，這次不加點。"], ["出題順序：先讓每一題都拿到第 1 次答對，再拿第 2 次、第 3 次……。", "每 5 題為一組：先依序出這 5 題，再複習這組還沒答對的題目，然後才出下一組新題目。"], ["所有題目都出現過一次後，會再做一次錯題複習，接著進入下一輪。", "下一輪會先跳過還沒拿滿的題目，並讓它們每隔一題就出現一次，直到補上為止。"], ["最後一輪結束後，會輪流複習剩下還沒達標的題目，全部達標就結束並顯示報告。"], ["中途按左上角返回也沒關係，進度與出題順序都會保留，下次按「開始練習」可選擇「接續上次」或「重新開始」。"]]], ["h", "單字題庫"], ["s", [["選擇題每題答對一次就算學會；筆試依設定的「每題需答對次數」計算。"], ["選擇題每 6～8 題為一回；答錯的題目，會在這一回的題目都做完一輪後再練習一次。每回結束出現回合總結，按「繼續邁向第 N 回」進入下一回。"], ["開啟「每個解釋都要練習」且題目為中文時，每個解釋是一道獨立的題目，各自計算是否學會，進度條與「已學會」也依題目數計算。"]]], ["h", "多題庫練習"], ["s", [["多題庫練習有自己的進度，每次重新開始都從 0% 計算，不會加上原本各題庫的進度，也不會更動原本題庫的進度。"]]]]},
{"f": "prac", "t": "答完後的筆記與星號", "ic": "note", "d": "答完後的筆記欄位、標註星號的地方與用途", "b": [["p", "每題答完後，除了解析之外，還可以馬上寫筆記；重點題也可以隨時標註星號。"], ["h", "筆記欄位"], ["s", [["每題答完後（搭配詞題、單字例句題、單字題庫的選擇題與筆試、隨機練習都一樣），解析下方會出現獨立的「筆記」欄位，不會混在解析裡。"], ["欄位一開始是收合的，同一行會顯示原有筆記的內容；沒有筆記時會顯示「點開新增筆記」。"], ["點開就可以編輯，修改會即時存回題庫裡這一題的筆記，之後在編輯頁、題目內容視窗都會看到新的內容，不用另外按儲存。"], ["在筆記裡按 Enter 只會換行，不會跳到下一題；要按「繼續」按鈕才會進入下一題。"]]], ["h", "標註星號"], ["s", [["練習時按題目卡片右上角的星星。"], ["在題庫編輯頁，按題目列右側的星星。"], ["在練習報告或清單裡，按該題右側的星星。"], ["單字題庫的星星有兩種顏色：黃色代表整個單字，綠色代表單一解釋，規則見「單字題庫：新增與編輯」和「單字題庫：選擇題」。"]]], ["h", "星號有什麼用"], ["s", [["開始練習時，可以選「僅練習標註星號的題目」。"], ["「檢視所有星號題目」可以看到所有標註星號的題目（單字題庫只標了部分解釋的單字，也會用綠色星星列出來）。"], ["可以把星號題目另存成新題庫，見「如何製作星號或錯題題庫」。"]]]]},
{"f": "prac", "t": "練習報告與練習紀錄", "ic": "chart", "d": "報告怎麼看、所有練習紀錄、搜尋與分頁、編輯刪除、整體報告", "b": [["p", "練習報告顯示這次練習每一題的答對率；過往的報告可以隨時回頭查看。"], ["h", "練習報告"], ["s", [["報告依答對率由低到高排列，「最常答錯」會標出最常答錯的字。"], ["色條顏色：紅色（50% 以下）、橘色（51%～99%）、綠色（100%）。"], ["輕點某題可看完整內容。", "過往報告可從題庫卡片的「⋯」或「個人檔案」→「檢視所有練習紀錄」查看。"], ["想看某個題庫「所有練習」合併後的答題情形，點題庫卡片的「⋯」→「整體報告」。"], ["練習紀錄標示「未完成」時，清單每一條百分比的左側會有「繼續練習」按鈕；點進報告後，上方總覽裡也有。按下去會回到離開時的進度繼續練習。只要那個題庫還沒有被刪除，任何未完成的練習都可以繼續。"]]], ["h", "檢視所有練習紀錄"], ["s", [["入口：首頁右上角人像圖示 →「檢視所有練習紀錄」。每條紀錄顯示題庫名稱（多題庫練習會顯示結合的題庫，例如「ABC + Happy」）、時間、題數與完成百分比。"], ["上方的搜尋框可以搜尋題庫名稱與日期，可輸入多個關鍵字（用空白隔開），需全部符合。"], ["超過 15 筆時分頁，頁面下方會標註總筆數與本頁範圍。"], ["標示「未完成」的紀錄，百分比左側有「繼續練習」按鈕，會回到離開時的進度。"], ["右上角的「編輯」：每條紀錄前面出現勾選框，點紀錄即可勾選（可跨頁、搭配搜尋，也可用「全選目前篩選結果」），再按下方的「刪除」並確認，就能一次刪除多筆；按「完成」離開編輯。"], ["刪除練習紀錄不會影響各題的答對率統計與題庫進度；如果刪掉的是未完成的紀錄，就不能再用「繼續練習」接續。"]]], ["t", "「檢視所有星號題目」與「檢視所有錯題」也有搜尋與分頁：可搜尋題目、翻譯、單字解釋、搭配詞／片語、筆記與題庫名稱。"], ["h", "整體報告"], ["s", [["題庫卡片的「⋯」→「整體報告」，會把這個題庫「所有練習」合併起來，看每題整體的答題情形。"]]]]},
{"f": "adv", "t": "混編與多題庫練習", "ic": "mix", "d": "把其他題庫的題目加進來，或多個題庫一起練習", "b": [["p", "有兩種做法：「混編」是把其他題庫的題目複製進目前的題庫；「多題庫練習」則不改動任何題庫，直接把幾個題庫混在一起練習。"], ["t", "「混編」只能加入「相同類型」的題目：搭配詞例句填空題庫只能加搭配詞題、單字例句填空題庫只能加單字例句題；「混搭題庫」可以加入兩種類型的題目（用「新增」時也能選題型）。「多題庫練習」可以把搭配詞、單字例句、混搭題庫一起練習；單字題庫只能和其他單字題庫一起練習。"], ["h", "做法 A：混編（複製題目到目前題庫）"], ["s", [["在首頁點要加入題目的題庫「編輯」，或按「題庫」新增一個題庫。"], ["在編輯頁按上方「混編」。", "需要有其他可以加入的題目才能使用。"], ["在視窗裡用「搜尋題目」輸入英文、中文或單字；「篩選題庫」選擇特定題庫；需要時勾選「僅星號題目」。"], ["勾選想加入的題目，或按「全選目前篩選結果」。", "視窗下方會顯示「篩選幾題・已選幾題」。"], ["按「加入所選題目」，題目會出現在目前題庫最後面。"], ["確認後按右上角「儲存」。"]]], ["t", "加入的是「複本」，原題庫不會改變。如果加入後與本題庫既有題目重複，該題會標紅，刪除其一才能儲存。"], ["t", "單字題庫（選擇題、筆試用）自成一類：混編只能加入單字題庫的單字，多題庫練習也不能把它和其他類型的題庫一起選。"], ["h", "做法 B：多題庫練習（不複製、直接練）"], ["s", [["在首頁按「多題庫練習」。"], ["可用「搜尋題庫」找題庫，勾選要一起練的題庫；「全選目前篩選結果」可一次全選。"], ["按「開始練習」，在設定視窗選擇是否打亂順序、每題需答對次數，再按「開始」。"]]], ["t", "多個單字題庫也可以一起做多題庫練習（選擇題或筆試），但不能和填空題庫混在一起選。"], ["t", "多題庫練習有自己獨立的進度：每次重新開始都從 0% 計算，不會加上原本各題庫的進度，也不會更動原本題庫的進度。名稱會顯示是哪些題庫結合的，例如「ABC + Happy」。未完成時，再選同一組題庫按「開始練習」，會顯示結合了哪些題庫並可接續上次。"]]},
{"f": "adv", "t": "如何製作星號或錯題題庫", "ic": "star", "d": "把重點題或常錯的題目挑出來，另存成新題庫", "b": [["p", "星號題庫收集你標註星號的題目；錯題題庫收集曾經答錯的題目。兩者都從「個人檔案」進入，製作流程相同。"], ["h", "先標註星號"], ["s", [["練習時按題目卡片右上角的星號。"], ["或在題庫編輯頁，按題目列右側的星號。"], ["或在練習報告、題目清單裡，按該題右側的星號。"]]], ["h", "製作星號題庫"], ["s", [["在首頁按右上角人像圖示進入「個人檔案」。"], ["點「檢視所有星號題目」。", "清單依答對率由低到高排列，尚未練習的排最後。"], ["按右上角「製作星號題庫」，進入獨立頁面。"], ["在「新題庫名稱」確認或修改名稱（預設為「星號題庫 月/日」）。"], ["用「搜尋題目」、「篩選題庫」、「答對率低於 %」縮小範圍。", "「篩選題庫」可直接輸入，也可從跳出的清單點選。"], ["勾選要放入的題目；「全選篩選結果」可把目前篩選出的題目一次全選。"], ["按右上角「建立題庫」，新題庫會出現在首頁。"]]], ["t", "新題庫裡的題目是複本，星號會被取消，原題庫不受影響。"], ["h", "製作錯題題庫"], ["s", [["進入「個人檔案」，點「檢視所有錯題」。", "清單依答對率由低到高排列。"], ["按右上角「製作錯題題庫」。"], ["步驟與上面相同；錯題頁可用「答對率低於 %」，例如填 60，只留下答對率低於 60% 的題目。"], ["按「建立題庫」完成。"]]], ["h", "小技巧與清單說明"], ["s", [["在清單中「長按」某一題約半秒，會直接進入製作頁，並預先勾選該題。"], ["清單每列的色條與百分比是「答對率」；「最常答錯」顯示你最常答錯的挖空字；輕點一下可看題目完整內容。"]]]]},
{"f": "adv", "t": "如何匯出及匯入紀錄或題庫", "ic": "swap", "d": "備份題庫、轉移到別的裝置、還原學習紀錄", "b": [["p", "「題庫」匯出成 TXT 檔，只包含題目；「學習記錄」匯出成 JSON 檔，包含題庫、資料夾、練習進度、報告與設定。入口有兩個：首頁的「匯入／匯出」，或「個人檔案」裡的「匯出／匯入學習記錄」，進去後是同一個頁面。"], ["h", "匯出題庫（TXT）"], ["s", [["進入「匯入／匯出」頁。"], ["在「匯出題庫 TXT」勾選要匯出的題庫（可多選）。"], ["按「匯出選取題庫」，下方會顯示內容。"], ["按「下載」存成「題庫.txt」，或按「複製」貼到別處。"]]], ["h", "匯出學習記錄（JSON）"], ["s", [["在同一頁按「匯出學習記錄」。"], ["按「下載」存成「學習記錄_日期.json」，或按「複製」。"]]], ["h", "匯入"], ["s", [["在「匯入」區按「選擇檔案」（可一次選多個 .txt／.json），或直接把內容貼在下方文字框。"], ["按「匯入」。"], ["TXT：會新增題庫，不影響現有題庫。", "內容中以 #題庫 開頭的行會建立新題庫；沒有的話，題庫名稱使用檔案名稱。"], ["JSON（學習記錄）：會「取代」目前所有題庫、進度與報告，系統會先跳出確認視窗。"]]], ["t", "匯入學習記錄前，建議先匯出一份目前的資料備份。個人檔案頁的 Google 文件同步也可以自動備份。"], ["t", "舊版匯出的學習記錄（JSON）、題庫 TXT 與 Google 文件資料，都可以直接匯入目前版本：舊版沒有的欄位會自動補上，舊版中途未完成的練習也能用「接續上次」繼續。"], ["c", "題庫 TXT 的內容格式（每題一行，欄位之間用 Tab 分隔）", "#題庫 第三課 單字測試\nKyle [was] deeply [upset about] not winning first place.\tKyle 對於沒有贏得第一名感到非常難過。\tbe upset about\t對……感到難過\tabout 後面接名詞或動名詞\t1"], ["p", "欄位依序為：英文句子、中文句子、單字/片語、翻譯、筆記、是否有星號（1 代表有星號）。後面欄位可以省略。此外，匯入也能直接讀取「使用AI提示詞來生成搭配詞題庫／單字例句題庫／單字題庫」三份說明裡的格式。"], ["h", "單字例句填空題庫與混搭題庫的 TXT"], ["p", "標題行會標示題庫類型：`#題庫`（搭配詞）、`#單字例句填空題庫`、`#混搭題庫`。單字例句題的每一行在原本 6 欄後面多 4 欄：第 7 欄固定是 `v`（代表單字例句題）、第 8 欄是單字解釋、第 9 欄是單字原形（供字尾提示使用），第 10 欄是手動設定的提示字母（可省略）。"], ["c", "單字例句填空題庫 TXT 範例（欄位之間用 Tab 分隔）", "#單字例句填空題庫 Lesson 5\nKiwi birds are [unique] to New Zealand.\t奇異鳥[為]紐西蘭[所獨有]。\tbe unique to + 地方\t為某地方所獨有\t=be native to + 地方\t\tv\t(adj.) 獨有的\tunique"], ["h", "單字題庫的 TXT"], ["p", "單字題庫的標題行是 `#單字題庫`；每個單字一行：英文單字、空、空、空、筆記、星號，第 7 欄固定是 `w`（代表單字卡），第 8 欄是單字翻譯，第 9 欄是例句，第 10 欄是例句翻譯，第 11 欄是所有解釋的完整資料（每個解釋各自的翻譯、例句、例句翻譯與星號，已編碼，請不要手動修改）。沒有第 11 欄的舊檔案一樣能匯入，單字翻譯會依 `(詞性)` 自動拆成多個解釋，例句歸在第一個解釋。"], ["c", "單字題庫 TXT 範例（欄位之間用 Tab 分隔）", "#單字題庫 Lesson 7\nunique\t\t\t\t\t\tw\t(adj.) 獨有的\tKiwi birds are [unique] to New Zealand.\t奇異鳥[為]紐西蘭[所獨有]。"], ["t", "舊版匯出的檔案不需要任何修改，可直接匯入；匯入的題庫會依內容自動判定為搭配詞、單字例句、混搭或單字題庫。舊版標題行 `#單字題庫`（現在稱為「單字例句填空題庫」）也能正確匯入。"]]},
{"f": "adv", "t": "Google 文件同步", "ic": "gear", "d": "把題庫與學習記錄自動備份到 Google 文件，在不同裝置使用同一份資料", "b": [["p", "同步會把題庫、學習進度、練習報告與設定存到一份 Google 文件，方便備份，也能在不同裝置使用同一份資料。網頁無法直接改寫 Google 文件，所以需要先用你的 Google 帳號建立一個免費的 Apps Script 當橋接。"], ["h", "第一次設定"], ["s", [["在「個人檔案」的同步區按「設定」。"], ["開啟 script.google.com → 新增專案，把設定視窗裡的程式碼整段貼上（視窗上有「複製程式碼」按鈕），並把 TOKEN 改成自己的密碼。"], ["按「部署 → 新增部署」，類型選「網頁應用程式」，執行身分選「我」，存取權選「任何人」，完成授權後複製網址（結尾是 /exec）。"], ["回到設定視窗，貼上網址與同一組密碼，按「儲存並同步」。"], ["之後如果更新了程式碼：部署 → 管理部署 → 編輯 → 版本選「新版本」→ 部署，網址不變。"]]], ["h", "自動同步的規則"], ["s", [["開啟 App、恢復連線，或第一次設定時，以「下載」為主：這台裝置沒有未上傳的變更 → 直接使用雲端資料；這台裝置有未上傳的變更，而雲端沒被動過 → 上傳；兩邊都被改過（或這台裝置尚未同步過而雲端已有資料）→ 跳出視窗詢問「下載雲端資料」或「上傳本機資料」，並再次確認。"], ["有變更後，約 3 秒會自動上傳；離開頁面（切到背景）時會立刻上傳。離線時會先等待，連線後自動同步。"]]], ["h", "手動操作"], ["s", [["「上傳資料」：清空文件，寫入這台裝置最新的資料。"], ["「下載資料」：確認後，會先清空這台裝置所有的題庫與學習記錄，再換成文件裡的內容。"], ["「設定」：修改網址與密碼；設定視窗裡的「停用同步」可以停止同步。"]]], ["h", "同步狀態"], ["s", [["已同步到 Google 文件（時間）：資料已經是最新的。"], ["有變更，等待同步…：變更後約 3 秒會自動上傳。"], ["離線中：連線後會自動同步。"], ["同步失敗：後面會寫原因，例如密碼（Token）不符、連線逾時、網址不是 /exec 結尾的部署網址。"], ["尚未設定同步：同步區會提示要先設定。"]]], ["t", "「下載資料」與詢問視窗裡的「下載雲端資料」都會取代這台裝置目前所有的資料，操作前建議先匯出一份備份。"], ["t", "如果是在 Claude 預覽視窗裡開啟檔案，可能無法連線到 Apps Script，請改用瀏覽器開啟下載的檔案。"]]},

function syHTML(){const d=SY.last?new Date(SY.last):null,hm=d?`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'';
 const L=`<a href="${DOCURL}" target=_blank rel=noopener>Google 文件</a>`;
 const T={off:`尚未設定同步到 ${L}`,syncing:'同步中…',ok:`已同步到 ${L}${hm?`（${hm}）`:''}`,pending:'有變更，等待同步…',offline:'離線中，連線後會自動同步',err:`同步失敗：${esc(SY.msg)}`}[SY.st];
 return `<div class="sy ${SY.st=='ok'?'ok':SY.st=='err'?'err':''}"><div class=syt><i></i><span>${T}</span></div><div class=syb><button class=sec data-act=syncnow>上傳資料</button><button class=sec data-act=dlall>下載資料</button><button class=sec data-act=syncset>設定</button></div></div>`}
const SDC={off:'',syncing:'ing',pending:'ing',offline:'ing',ok:'ok',err:'err'},SDT={off:'未設定同步',syncing:'同步中',pending:'有變更，等待同步',offline:'離線，連線後同步',ok:'已同步',err:'同步失敗'};
function syUpd(st,msg){if(st){SY.st=st;SY.msg=msg||''}const el=$('#sy');if(el)el.innerHTML=syHTML();const d=$('#sd');if(d){d.className='sd '+SDC[SY.st];d.title=SDT[SY.st]}}
const syChk=j=>{if(!j||!j.ok)throw new Error(j&&j.error=='token'?'密碼（Token）不符':(j&&j.error)||'伺服器錯誤');return j};
async function syFetch(body){let to;const tm=new Promise((_,rej)=>{to=setTimeout(()=>{const e=new Error('連線逾時');e.name='TimeoutError';rej(e)},25000)});
 try{const req=body?fetch(SY.url,{method:'POST',body:JSON.stringify({...body,token:SY.token}),redirect:'follow'}):fetch(SY.url+(SY.url.includes('?')?'&':'?')+'token='+encodeURIComponent(SY.token)+'&t='+Date.now(),{redirect:'follow'});
  const r=await Promise.race([req,tm]);let j;try{j=await Promise.race([r.json(),tm])}catch(e){if(e&&e.name=='TimeoutError')throw e;throw new Error('回應格式不正確，請確認網址是 Apps Script 的部署網址（/exec）')}
  return syChk(j)}finally{clearTimeout(to)}}
function syJsonp(p){return new Promise((res,rej)=>{const cb='sycb'+Date.now()+Math.floor(Math.random()*1e4),sc=document.createElement('script');let done=0,t;const fin=(e,v)=>{if(done)return;done=1;clearTimeout(t);try{delete window[cb]}catch(x){window[cb]=undefined}sc.remove();e?rej(e):res(v)};window[cb]=v=>fin(0,v);t=setTimeout(()=>fin(new Error('逾時')),15000);sc.onerror=()=>fin(new Error('載入失敗'));sc.src=SY.url+'?'+new URLSearchParams({...p,token:SY.token,callback:cb}).toString();document.head.append(sc)})}
function syForm(fields){return new Promise((res,rej)=>{const id='syf'+Date.now()+Math.floor(Math.random()*1e4),ifr=document.createElement('iframe'),f=document.createElement('form');let done=0,t;ifr.name=id;ifr.style.display='none';f.method='POST';f.action=SY.url;f.target=id;f.style.display='none';
 const on=e=>{if(e.data&&e.data.sy===id)fin(0,e.data)},fin=(er,v)=>{if(done)return;done=1;clearTimeout(t);window.removeEventListener('message',on);ifr.remove();f.remove();er?rej(er):res(v)};
 t=setTimeout(()=>fin(new Error('逾時')),30000);window.addEventListener('message',on);
 Object.entries({...fields,token:SY.token,reqid:id}).forEach(([k,v])=>{const i=document.createElement('textarea');i.name=k;i.value=v;f.append(i)});document.body.append(ifr,f);f.submit()})}
async function syCall(body){

 catch(e){if(!(e instanceof TypeError))throw e;

  catch(e2){if(e2&&/Token/.test(e2.message||''))throw e2;const er=new Error('無法連線到 Apps Script。請確認：部署存取權為「任何人」、已完成授權，且已更新成「設定」裡最新版的程式碼並重新部署；若是在 Claude 預覽視窗中開啟，請改用瀏覽器開啟下載的檔案');er.name='NetError';throw er}}}

const doPush=async()=>{const h0=hsh(snapStr());await syCall({action:'set',text:JSON.stringify(payload())});SY.h=h0;SY.last=Date.now();SY.pend=hsh(snapStr())!==h0;sySave()};
const markSynced=()=>{SY.h=hsh(snapStr());SY.pend=false;SY.last=Date.now();sySave()};
const parseDoc=t=>{t=(t||'').trim();if(!t)return null;try{const j=JSON.parse(t);return j&&(j.app=='fillblank'||j.app===undefined)&&Array.isArray(j.decks)?j:null}catch(e){return null}};
const idle=()=>view=='home'||view=='profile';

/* 只有「資料有變更」才會上傳：與上次同步的內容比對，沒變就不送 */
function syQueue(){if(!SY.url)return;if(hsh(snapStr())===SY.h){if(SY.pend){SY.pend=false;sySave()}if(SY.st=='pending')syUpd('ok');return}
 SY.pend=true;sySave();if(!navigator.onLine)return syUpd('offline');if(!SY.ready)return;syUpd('pending');clearTimeout(SY.tm);SY.tm=setTimeout(syPush,3000)}
async function syPush(){if(!SY.url||!SY.ready||!SY.pend)return;if(!navigator.onLine)return syUpd('offline');if(SY.busy){SY.dirty=true;return}SY.busy=true;SY.dirty=false;syUpd('syncing');

function syAsk1(pend){return new Promise(res=>{const m=modal(`<h3>雲端資料與本機不同</h3><p>${pend?'這台裝置有尚未上傳的變更，而雲端的資料也已被更新過。':'這台裝置尚未同步過，而雲端已有學習記錄。'}要下載雲端資料取代本機，還是用本機資料覆蓋雲端？</p><div class=rt><button class=sec id=a>下載雲端資料</button><button class=pri id=b>上傳本機資料</button></div>`),c0=m.close;m.close=()=>{c0();res('cancel')};m.querySelector('#a').onclick=()=>{res('cloud');c0()};m.querySelector('#b').onclick=()=>{res('local');c0()}})}

/* 開啟／恢復連線／首次設定：以「下載」為主。沒有本機變更 → 直接用雲端資料；有本機變更且雲端沒被動過 → 上傳；兩邊都動過 → 詢問 */
async function sync(manual){
 if(!SY.url){syUpd('off');if(manual)syncSet();return}
 if(!navigator.onLine){syUpd('offline');if(manual)toast('目前離線，連線後會自動同步');return}
 if(SY.busy)return;SY.busy=true;clearTimeout(SY.tm);syUpd('syncing');
 try{const j=await syCall(),rem=parseDoc(j.text);let msg='已是最新';
  if(!idle()){SY.busy=false;SY.again=true;return}

  else{const rh=hsh(remSnap(rem));
   if(rh===hsh(snapStr()))markSynced();
   else if(SY.pend&&rh===SY.h){await doPush();msg='已上傳到 Google 文件'}
   else if(isEmpty()){setData(rem);msg='已從雲端載入最新資料'}
   else if(SY.pend||!SY.last){const c=await syAsk(SY.pend);if(c=='cancel'){SY.busy=false;syUpd('err','已取消，尚未同步');return}if(c=='cloud'){setData(rem);msg='已從雲端載入最新資料'}else{await doPush();msg='已上傳到 Google 文件'}}
   else{setData(rem);msg='已從雲端載入最新資料'}}
  SY.ready=true;SY.busy=false;syUpd('ok');if(manual)toast(msg);if(SY.pend)syQueue()}
 catch(e){const m=syErr(e);if(manual)toast('同步失敗：'+m)}}

 SY.busy=true;clearTimeout(SY.tm);SY.dirty=false;syUpd('syncing');
 try{if(!S.ts){S.ts=Date.now();saveRaw()}await doPush();SY.ready=true;SY.busy=false;syUpd('ok');toast('已清空文件並寫入最新資料');if(SY.pend)syQueue()}

function syncSet(){const tk=(SY.token||DEF_TOKEN).replace(/['\\\n]/g,''),code=`const DOC_ID = '${DOCID}';
const TOKEN = '${tk}';

function json_(o, cb) {
  var t = JSON.stringify(o);
  if (cb && /^[\\w$.]+$/.test(cb)) {
    return ContentService.createTextOutput(cb + '(' + t + ')')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService.createTextOutput(t)
    .setMimeType(ContentService.MimeType.JSON);

function doGet(e) {
  var p = e.parameter;
  if (p.token !== TOKEN) return json_({ok: false, error: 'token'}, p.callback);
  var text = DocumentApp.openById(DOC_ID).getBody().getText();
  return json_({ok: true, text: text}, p.callback);
}
function save_(text) {
  var body = DocumentApp.openById(DOC_ID).getBody();
  body.clear();
  body.setText(text);
}
function doPost(e) {
  var p = e.parameter;
  if (p.reqid) {
    var id = String(p.reqid).replace(/[^\\w]/g, '');
    var ok = p.token === TOKEN;
    if (ok) save_(p.text);
    var msg = JSON.stringify({sy: id, ok: ok, error: ok ? '' : 'token'}).replace(/</g, '\\\\u003c');
    return HtmlService.createHtmlOutput(
      '<script>var m=' + msg + ';[window.parent.parent, window.top].forEach(function(w){try{w.postMessage(m,"*")}catch(x){}})<\/script>'
    ).setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
  }
  var d = JSON.parse(e.postData.contents);
  if (d.token !== TOKEN) return json_({ok: false, error: 'token'});
  save_(d.text);
  return json_({ok: true});
}`;
 const m=modal(`<h3>Google 文件同步設定</h3><p style="font-size:13px;line-height:1.7;margin:0 0 8px">網頁無法直接改寫 Google 文件，需先用你的 Google 帳號建立一個免費的 Apps Script 當橋接：<br>1. 開啟 script.google.com → 新增專案，貼上下方程式碼，並把 TOKEN 改成自訂密碼。<br>2. 按「部署 → 新增部署」，類型選「網頁應用程式」，執行身分選「我」，存取權選「任何人」，完成授權後複製網址。（之後若更新程式碼：部署 → 管理部署 → 編輯 → 版本選「新版本」→ 部署，網址不變。）<br>3. 把網址與同一組密碼填到下方。</p><textarea id=sc readonly rows=9 style="font-size:12px;font-family:ui-monospace,Menlo,monospace">${esc(code)}</textarea><div class=row style="margin:6px 0 0"><button class=sec id=cc>複製程式碼</button></div>

 <div class=rt><button class=sec id=x>取消</button>${SY.url?'<button class=sec id=off style="color:var(--r)">停用同步</button>':''}<button class=pri id=sv>儲存並同步</button></div>`,true),q=s=>m.querySelector(s);
